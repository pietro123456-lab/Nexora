<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reino dos Leilões</title>
<style>
:root{--bg:#090a0e;--panel:#12151d;--panel2:#171b25;--gold:#e5b84d;--gold2:#f5d783;--muted:#8991a2;--line:#252b38;--text:#f3f4f7;--green:#63d49a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#252031 0,transparent 45%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;border:0}header{position:sticky;top:0;z-index:10;background:#090a0ee8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:20px;font-weight:900;letter-spacing:.3px}.brand span{color:var(--gold)}.wallet{background:var(--panel);border:1px solid #59482b;border-radius:12px;padding:9px 14px;color:var(--gold2);font-weight:800}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1400px;margin:auto;min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--line);padding:22px 14px}.navbtn{display:block;width:100%;text-align:left;background:transparent;color:#aab1c0;padding:13px;border-radius:10px;margin-bottom:5px}.navbtn.active,.navbtn:hover{background:#24232a;color:var(--gold2)}main{padding:28px 4%;min-width:0}.hero{padding:26px;border-radius:18px;background:linear-gradient(115deg,#24202b,#171b25 70%,#302618);border:1px solid #43382b;margin-bottom:24px}.hero h1{font-size:clamp(25px,4vw,40px);margin:0 0 8px}.hero p{color:#b9bdc8;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}.stat small{color:var(--muted);display:block;margin-bottom:6px}.stat strong{font-size:22px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 15px}.heading h2{margin:0;font-size:20px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filter,.sort{background:var(--panel);color:#c3c8d4;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.filter.active{border-color:var(--gold);color:var(--gold2)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.item{overflow:hidden;padding:0}.art{height:150px;display:grid;place-items:center;font-size:66px;background:linear-gradient(140deg,#242837,#161923)}.itembody{padding:15px}.rarity{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;font-weight:900}.legendary{color:#e8bd51}.epic{color:#ba86ff}.rare{color:#66baff}.common{color:#a6afbc}.item h3{margin:8px 0}.meta{color:var(--muted);font-size:13px;display:flex;justify-content:space-between;margin:10px 0}.bid{color:var(--gold2);font-weight:900;font-size:20px}.primary{background:linear-gradient(135deg,#f0c968,#d29a32);color:#17120a;font-weight:900;padding:11px 14px;border-radius:10px;width:100%;margin-top:12px}.primary:hover{filter:brightness(1.08)}.secondary{background:#252a35;color:#d8dce6;border:1px solid var(--line);padding:10px 14px;border-radius:10px}.empty{padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#202630;border:1px solid #3a4654;padding:13px 20px;border-radius:12px;z-index:20;box-shadow:0 8px 35px #0008}.modalbg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:30;padding:20px}.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:400px;width:100%}.modal input,.modal select{width:100%;background:#090b11;color:white;border:1px solid var(--line);border-radius:9px;padding:12px;margin:8px 0}.hide{display:none!important}.footer{color:#596170;font-size:12px;text-align:center;padding:24px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){header{padding:12px 4%}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px;display:flex;overflow:auto;gap:4px}.navbtn{white-space:nowrap;width:auto;margin:0;padding:10px}main{padding:18px 4%}.grid{grid-template-columns:1fr 1fr;gap:10px}.art{height:120px;font-size:52px}.itembody{padding:12px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:18px}.hero{padding:20px}}@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand">🏛️ Reino <span>dos Leilões</span></div><div class="wallet">🪙 <b id="coins">0</b></div></header>
<div class="layout"><aside>
<button class="navbtn active" data-page="market">🔨 Mercado</button>
<button class="navbtn" data-page="inventory">🎒 Inventário</button>
<button class="navbtn" data-page="history">📜 Histórico</button>
<button class="navbtn" data-page="ranking">👑 Ranking</button>
<button class="navbtn" data-page="daily">🎁 Recompensa diária</button>
</aside><main id="main"></main></div>
<div class="footer">Reino dos Leilões • Jogo fictício • Moedas sem valor real</div>
<script>
const starter=[
{id:1,name:"Coroa do Reino Antigo",icon:"👑",rarity:"Lendário",class:"legendary",price:520,owner:"Mercado",end:Date.now()+3600000,category:"Relíquias"},
{id:2,name:"Fênix de Cristal",icon:"🔥",rarity:"Épico",class:"epic",price:340,owner:"Mercado",end:Date.now()+2400000,category:"Relíquias"},
{id:3,name:"Hypercar Nebula",icon:"🏎️",rarity:"Lendário",class:"legendary",price:760,owner:"Mercado",end:Date.now()+5100000,category:"Veículos"},
{id:4,name:"Katana Lunar",icon:"🗡️",rarity:"Raro",class:"rare",price:180,owner:"Mercado",end:Date.now()+1800000,category:"Colecionáveis"},
{id:5,name:"Terreno Aurora",icon:"🏝️",rarity:"Épico",class:"epic",price:430,owner:"Mercado",end:Date.now()+4200000,category:"Terrenos"},
{id:6,name:"Sneaker Quantum",icon:"👟",rarity:"Raro",class:"rare",price:220,owner:"Mercado",end:Date.now()+3300000,category:"Colecionáveis"},
{id:7,name:"Relógio Eclipse",icon:"⌚",rarity:"Épico",class:"epic",price:390,owner:"Mercado",end:Date.now()+2800000,category:"Colecionáveis"},
{id:8,name:"Dragão Miniatura",icon:"🐉",rarity:"Lendário",class:"legendary",price:850,owner:"Mercado",end:Date.now()+6100000,category:"Relíquias"},
{id:9,name:"Quadro Galáxia",icon:"🌌",rarity:"Comum",class:"common",price:90,owner:"Mercado",end:Date.now()+1300000,category:"Arte"}
];
let state=JSON.parse(localStorage.getItem("auctionRealm")||"null")||{coins:2500,items:starter,bids:[],inventory:[],lastDaily:"",won:0};
function save(){localStorage.setItem("auctionRealm",JSON.stringify(state));}
function money(n){return n.toLocaleString("pt-BR")+" moedas"}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}
function timer(end){let diff=Math.max(0,end-Date.now());let h=Math.floor(diff/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);return diff===0?"Encerrado":h+"h "+m+"m "+s+"s"}
let page="market",category="Todos",search="";
function nav(p){page=p;document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>nav(b.dataset.page));
function card(it){return `<article class="card item"><div class="art">${it.icon}</div><div class="itembody"><span class="rarity ${it.class}">${it.rarity}</span><h3>${it.name}</h3><div class="meta"><span>⏱ ${timer(it.end)}</span><span>${it.category}</span></div><div class="meta"><span>Maior lance</span><span class="bid">${money(it.price)}</span></div><button class="primary" onclick="bid(${it.id})">${it.owner==="Você"?"Item seu":"Dar lance +"+money(Math.ceil(it.price*.1))}</button></div></article>`}
function render(){document.getElementById("coins").textContent=state.coins.toLocaleString("pt-BR");const main=document.getElementById("main");
if(page==="market"){let cats=["Todos","Relíquias","Veículos","Colecionáveis","Terrenos","Arte"];let items=state.items.filter(i=>i.owner!=="Você"&&i.end>Date.now()&&(category==="Todos"||i.category===category)&&i.name.toLowerCase().includes(search.toLowerCase()));main.innerHTML=`<section class="hero"><h1>O maior leilão começa aqui.</h1><p>Dispute peças raras, faça fortuna e construa seu império. Tudo com moedas fictícias.</p></section><div class="stats"><div class="stat"><small>Saldo disponível</small><strong>🪙 ${state.coins.toLocaleString("pt-BR")}</strong></div><div class="stat"><small>Itens conquistados</small><strong>🎒 ${state.inventory.length}</strong></div><div class="stat"><small>Leilões vencidos</small><strong>🏆 ${state.won}</strong></div></div><div class="heading"><h2>Leilões em andamento</h2><button class="secondary" onclick="createAuction()">＋ Criar leilão</button></div><div class="filters"><input class="sort" placeholder="🔎 Buscar item..." value="${search.replaceAll('"','&quot;')}" oninput="search=this.value;render()" style="min-width:140px"><div>${cats.map(c=>`<button class="filter ${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join("")}</div></div><div class="grid">${items.length?items.map(card).join(""):'<div class="empty">Nenhum leilão encontrado nessa categoria.</div>'}</div>`}
else if(page==="inventory"){main.innerHTML=`<div class="heading"><h2>🎒 Meu inventário</h2></div><div class="grid">${state.inventory.length?state.inventory.map(i=>`<article class="card item"><div class="art">${i.icon}</div><div class="itembody"><span class="rarity ${i.class}">${i.rarity}</span><h3>${i.name}</h3><div class="meta">Valor estimado <b>${money(i.price)}</b></div></div></article>`).join(""):'<div class="empty">Ainda não conquistaste itens. Visita os leilões!</div>'}</div>`}
else if(page==="history"){main.innerHTML=`<div class="heading"><h2>📜 Histórico de lances</h2></div><div class="card">${state.bids.length?'<table class="table"><thead><tr><th>Item</th><th>Lance</th><th>Data</th></tr></thead><tbody>'+state.bids.slice().reverse().map(b=>`<tr><td>${b.name}</td><td>${money(b.price)}</td><td>${b.date}</td></tr>`).join("")+'</tbody></table>':'<div class="empty">Os teus lances aparecerão aqui.</div>'}</div>`}
else if(page==="ranking"){let players=[{n:"Lord Aureus",v:12800},{n:"Dama Imperial",v:10900},{n:"Mestre dos Lances",v:8700},{n:"Pietro",v:state.coins+state.inventory.reduce((a,i)=>a+i.price,0)},{n:"Barão de Ouro",v:6300},{n:"Duque Lunar",v:5100}].sort((a,b)=>b.v-a.v);main.innerHTML=`<div class="heading"><h2>👑 Ranking dos magnatas</h2></div><div class="card"><table class="table"><thead><tr><th>#</th><th>Magnata</th><th>Patrimônio estimado</th></tr></thead><tbody>${players.map((p,i)=>`<tr><td>${["🥇","🥈","🥉"][i]||i+1}</td><td>${p.n}</td><td>${money(p.v)}</td></tr>`).join("")}</tbody></table></div>`}
else if(page==="daily"){main.innerHTML=`<section class="hero"><h1>🎁 Recompensa diária</h1><p>Volte todos os dias e receba moedas grátis para disputar itens incríveis.</p></section><div class="card" style="max-width:420px"><h2>Recompensa de hoje</h2><p style="color:var(--gold2);font-size:26px;font-weight:900">🪙 500 moedas</p><button class="primary" onclick="daily()">Resgatar recompensa</button></div>`}
}
function bid(id){let it=state.items.find(x=>x.id===id);if(!it)return;let increment=Math.ceil(it.price*.1),amount=it.price+increment;if(state.coins<amount){toast("Saldo insuficiente!");return}if(!confirm("Dar lance de "+money(amount)+" em "+it.name+"?"))return;state.coins-=amount;it.price=amount;it.owner="Você";state.bids.push({name:it.name,price:amount,date:new Date().toLocaleString("pt-BR")});state.inventory.push({...it});state.won++;save();render();toast("Lance registrado! Item conquistado na simulação 🎉")}
function daily(){let today=new Date().toISOString().slice(0,10);if(state.lastDaily===today){toast("Recompensa já resgatada hoje!");return}state.lastDaily=today;state.coins+=500;save();render();toast("500 moedas recebidas! 🪙")}
function createAuction(){let bg=document.createElement("div");bg.className="modalbg";bg.innerHTML='<div class="modal"><h2>✨ Criar leilão fictício</h2><p style="color:var(--muted)">Escolha um item para colocar no mercado.</p><input id="newName" placeholder="Nome do item"><select id="newCat"><option>Relíquias</option><option>Veículos</option><option>Colecionáveis</option><option>Terrenos</option><option>Arte</option></select><select id="newRare"><option>Comum</option><option>Raro</option><option>Épico</option><option>Lendário</option></select><input id="newPrice" type="number" min="1" placeholder="Preço inicial (moedas)"><button class="primary" onclick="submitAuction()">Publicar leilão</button><button class="secondary" style="width:100%;margin-top:8px" onclick="this.closest(\'.modalbg\').remove()">Cancelar</button></div>';document.body.appendChild(bg)}
function submitAuction(){let name=document.getElementById("newName").value.trim(),price=Number(document.getElementById("newPrice").value),cat=document.getElementById("newCat").value,rare=document.getElementById("newRare").value;if(!name||price<1){toast("Preencha o nome e um preço válido.");return}let classes={Comum:"common",Raro:"rare",Épico:"epic",Lendário:"legendary"};let icons=["🎁","💎","🏆","🪙","🖼️","🏰"];state.items.unshift({id:Date.now(),name,icon:icons[Math.floor(Math.random()*icons.length)],rarity:rare,class:classes[rare],price,owner:"Mercado",end:Date.now()+86400000,category:cat});save();document.querySelector(".modalbg").remove();render();toast("Leilão publicado!")}
render();setInterval(()=>{if(page==="market")render()},1000);
</script></body></html>
